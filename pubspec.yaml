name: open_app
description: Open - soru ile profili açmaya dayalı modern flört uygulaması MVP.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icons/gradient/
    - assets/app_icons/line/
    - assets/app_icons/nav/
    - assets/app_icons/badge/
