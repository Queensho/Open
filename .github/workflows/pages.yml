name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform
        run: flutter create . --platforms=web --project-name open_app --no-pub

      - name: Reset pub.dev credentials
        run: dart pub token remove https://pub.dev || true

      - name: Get dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib

      - name: Build web without service worker cache
        run: flutter build web --release --target lib/bootstrap.dart --base-href "/Open/" --pwa-strategy=none

      - name: Remove stale service worker artifacts
        run: |
          rm -f build/web/flutter_service_worker.js
          rm -f build/web/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
