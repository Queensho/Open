name: One-time keys navigation fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/route-keys-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route popup action to Keys tab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/real_app_shell.dart')
          s=p.read_text()
          old="final sent=await Navigator.push<bool>(context,MaterialPageRoute(builder:(_)=>RealAnswerScreen(profile:profile,questions:questions)));if(sent==true&&mounted)setState(()=>cardIndex++);"
          new="final sent=await Navigator.push<bool>(context,MaterialPageRoute(builder:(_)=>RealAnswerScreen(profile:profile,questions:questions)));if(!mounted)return;if(sent==true){setState(()=>cardIndex++);}else if(sent==false){Navigator.of(context).pop('keys');}"
          if old not in s: raise SystemExit('discover return pattern not found')
          s=s.replace(old,new,1)
          old2="final sent=await Navigator.push<bool>(context,MaterialPageRoute(builder:(_)=>RealAnswerScreen(profile:profile,questions:questions)));if(sent==true&&mounted)setState(()=>cardIndex++);"
          # only one occurrence is expected; already replaced above
          old3="final pages=<Widget>[const RealDiscoverScreen(),const FixedRealKeysScreen(),const EnhancedMessagesScreen(),RealProfileScreen(onSignedOut:widget.onSignedOut)];"
          new3="final pages=<Widget>[Navigator(onGenerateRoute:(_)=>MaterialPageRoute(builder:(_)=>const RealDiscoverScreen()),onPopPage:(route,result){if(route.didPop(result)){if(result=='keys'){WidgetsBinding.instance.addPostFrameCallback((_){if(mounted)setState(()=>index=1);_counts();});}return true;}return false;}),const FixedRealKeysScreen(),const EnhancedMessagesScreen(),RealProfileScreen(onSignedOut:widget.onSignedOut)];"
          if old3 not in s: raise SystemExit('pages pattern not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          rm .github/workflows/route-keys-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/real_app_shell.dart .github/workflows/route-keys-fix.yml
          git commit -m 'Route key popup to Keys tab'
          git push